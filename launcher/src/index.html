<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Emulator</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Android Game Launcher</h1>
      <p id="subtitle">Pick a device and Android version, then play.</p>

      <div class="row">
        <label for="device-select">Device</label>
        <select id="device-select"></select>
      </div>
      <div class="row">
        <label for="version-select">Android version</label>
        <select id="version-select"></select>
      </div>

      <button id="setup-btn">Set Up</button>
      <button id="play-btn" hidden>Play</button>

      <pre id="log"></pre>
    </main>
  </body>
</html>
